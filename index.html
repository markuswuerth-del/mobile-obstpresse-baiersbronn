<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mobile Obstpresse Baiersbronn</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

input{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    box-sizing:border-box;
}

button{
    background:#2e7d32;
    color:white;
    border:none;
    border-radius:6px;
    padding:12px 20px;
    cursor:pointer;
}

.shift{
    border:1px solid #ddd;
    border-radius:8px;
    padding:10px;
    margin-bottom:10px;
}

.overview-card{
    border:1px solid #ddd;
    border-radius:8px;
    margin-bottom:15px;
    padding:10px;
    background:#fff;
}
.radio-group{
    display:flex;
    gap:10px;
    margin-top:10px;
    flex-wrap:wrap;
}

.choice{
    padding:8px 12px;
    border:1px solid #ddd;
    border-radius:8px;
    cursor:pointer;
    background:white;
}

.choice input{
    margin-right:5px;
    width:auto;
}

.yes{
    background:#e8f5e9;
}

.maybe{
    background:#fff8e1;
}

.no{
    background:#ffebee;
}

h1,h2,h3{
    margin-top:0;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🍎 Mobile Obstpresse Baiersbronn</h1>
<div style="text-align:center;">

<img
src="logo-baiersbronn.png"
alt="Gemeinde Baiersbronn"
style="
max-width:180px;
margin-bottom

<p>
Vielen Dank für eure Unterstützung bei der Mobilen Obstpresse Baiersbronn.
</p>

<p>
Die angegebenen Uhrzeiten dienen lediglich als grobe
Verfügbarkeitsabfrage. Die tatsächlichen Einsatzzeiten richten sich nach
den gebuchten Press-Terminen und können davon abweichen.
</p>

</div>

<div class="card">

<h2>Persönliche Daten</h2>

<input id="firstName" placeholder="Vorname">

<input id="lastName" placeholder="Nachname">

<button onclick="checkPerson()">
Weiter
</button>

<div id="personStatus"></div>

<div id="shiftContainer" style="display:none;"></div>

<div id="saveContainer" style="display:none;">

<button onclick="saveData()">
Speichern
</button>

</div>

</div>

<div class="card">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
">

<h2>Wer kann wann?</h2>

<button onclick="showAdminLogin()">
🔒 Admin
</button>

</div>

<div id="adminLogin"
style="
display:none;
background:#fff3cd;
padding:15px;
border-radius:8px;
margin-bottom:15px;
">

<h3>Admin Anmeldung</h3>

<input
type="password"
id="adminPassword"
placeholder="Passwort">

<button onclick="loginAdmin()">
Anmelden
</button>

</div>

<div
id="adminPanel"
style="display:none;"
>

<h2>🔒 Adminbereich</h2>

<button onclick="exportAllCSV()">
📥 Gesamtexport CSV
</button>

<br><br>

<div id="weekendExports"></div>

</div>

<div id="overview">
Lade Daten...
</div>

<div id="overview">

<hr>

<h2>Eingetragene Helfer</h2>

<div id="participantsList"></div>
Lade Daten...
</div>

</div>

</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyx0Nu-qokdbEti73VTUS0C9HMv_FaIT93J2F9Xb1bdiowNlt5eiz-VAbCd6aohJjcq/exec";

const shifts = [];

function createShifts(){

    const start = new Date("2026-09-11");
    const end = new Date("2026-10-31");

    for(
        let d = new Date(start);
        d <= end;
        d.setDate(d.getDate()+1)
    ){

        const weekday = d.getDay();
        const date = d.toLocaleDateString("de-DE");

        if(weekday === 5){

            shifts.push({
                id: date + "-fr",
                label: date + " (Freitag) 13:00 - 19:00"
            });

        }

        if(weekday === 6){

            shifts.push({
                id: date + "-sa1",
                label: date + " (Samstag) 07:00 - 12:00"
            });

            shifts.push({
                id: date + "-sa2",
                label: date + " (Samstag) 12:00 - 19:00"
            });

        }
    }

    renderShifts();
}

function renderShifts(){

    const container =
        document.getElementById("shiftContainer");

    container.innerHTML = "";

    shifts.forEach((shift)=>{

        container.innerHTML += `
            <div class="shift">

                <strong>${shift.label}</strong>

<div class="radio-group">

<label class="choice yes">
<input
type="radio"
name="${shift.id}"
value="Ja"
checked>
🟢 Ja
</label>

<label class="choice maybe">
<input
type="radio"
name="${shift.id}"
value="Vielleicht">
🟡 Vielleicht
</label>

<label class="choice no">
<input
type="radio"
name="${shift.id}"
value="Nein">
🔴 Nein
</label>

</div>

            </div>
        `;

    });

}

async function saveData(){

    const firstName =
        document.getElementById("firstName").value.trim();

    const lastName =
        document.getElementById("lastName").value.trim();

    if(!firstName || !lastName){

        alert(
          "Bitte Vor- und Nachname eingeben."
        );

        return;
    }

    const entries = [];

    for(const shift of shifts){

        const selected =
            document.querySelector(
                `input[name="${shift.id}"]:checked`
            );

        entries.push({
            shift: shift.label,
            status: selected.value
        });

    }

    await fetch(
      SCRIPT_URL,
      {
        method:"POST",
        body:JSON.stringify({
          firstName,
          lastName,
          entries
        })
      }
    );

    alert(
      "Daten erfolgreich gespeichert."
    );

    loadOverview();

}
async function exportAllCSV(){

    const response =
      await fetch(SCRIPT_URL);

    const data =
      await response.json();

    let csv =
      "Vorname;Nachname;Schicht;Status\n";

    data.forEach(row => {

        csv +=
          `${row.firstName};${row.lastName};${row.shift};${row.status}\n`;

    });

    downloadCSV(
      csv,
      "Obstpresse-Gesamt.csv"
    );

}

async function loadParticipantList(){

    const response =
        await fetch(SCRIPT_URL);

    const data =
        await response.json();

    const participants =
        document.getElementById(
            "participantsList"
        );

    participants.innerHTML = "";

    const uniqueNames = [];

    data.forEach(entry=>{

        const fullName =
            entry.firstName +
            " " +
            entry.lastName;

        if(
            !uniqueNames.includes(fullName)
        ){
            uniqueNames.push(fullName);
        }

    });

    uniqueNames.sort();

    uniqueNames.forEach(name=>{

        participants.innerHTML += `
            <div
            style="
            padding:8px;
            border-bottom:1px solid #ddd;
            ">
                ${name}
            </div>
        `;

    });

}

async function checkPerson(){

    const firstName =
        document.getElementById("firstName").value.trim();

    const lastName =
        document.getElementById("lastName").value.trim();

    if(!firstName || !lastName){

        alert(
            "Bitte Vor- und Nachname eingeben."
        );

        return;
    }

    const response =
        await fetch(SCRIPT_URL);

    const data =
        await response.json();

    const personEntries =
        data.filter(entry =>

            entry.firstName
                .trim()
                .toLowerCase() ===
            firstName
                .trim()
                .toLowerCase()

            &&

            entry.lastName
                .trim()
                .toLowerCase() ===
            lastName
                .trim()
                .toLowerCase()

        );

    const status =
        document.getElementById("personStatus");

    document
        .getElementById("shiftContainer")
        .style.display = "block";

    document
        .getElementById("saveContainer")
        .style.display = "block";

    if(personEntries.length === 0){

        status.innerHTML =
            "✅ Neuer Eintrag";

        renderShifts();

        return;
    }

    status.innerHTML =
        "✅ Vorhandene Daten gefunden";

    renderShifts();

    personEntries.forEach(entry => {

        const shift =
            shifts.find(
                s => s.label === entry.shift
            );

        if(!shift){
            return;
        }

        const radio =
            document.querySelector(
                `input[name="${shift.id}"][value="${entry.status}"]`
            );

        if(radio){
            radio.checked = true;
        }

    });

}

async function loadOverview(){

    try{

        const response =
            await fetch(SCRIPT_URL);

        const data =
            await response.json();

        const overview =
            document.getElementById("overview");

        overview.innerHTML = "";

        shifts.forEach((shift)=>{

            const yes =
                data.filter(
                    d =>
                    d.shift === shift.label &&
                    d.status === "Ja"
                );

            const maybe =
                data.filter(
                    d =>
                    d.shift === shift.label &&
                    d.status === "Vielleicht"
                );

            const no =
                data.filter(
                    d =>
                    d.shift === shift.label &&
                    d.status === "Nein"
                );

            overview.innerHTML += `

                <div class="overview-card">

                    <h3>${shift.label}</h3>

                    <p>
                    🟢 Ja (${yes.length})
                    </p>

                    ${yes.map(
                        p =>
                        `${p.firstName} ${p.lastName}<br>`
                    ).join("")}

                    <p>
                    🟡 Vielleicht (${maybe.length})
                    </p>

                    ${maybe.map(
                        p =>
                        `${p.firstName} ${p.lastName}<br>`
                    ).join("")}

                    <p>
                    🔴 Nein (${no.length})
                    </p>

                    ${no.map(
                        p =>
                        `${p.firstName} ${p.lastName}<br>`
                    ).join("")}

                </div>

            `;

        });

    }
    catch(error){

        console.error(error);

        document.getElementById("overview").innerHTML =
            "Fehler beim Laden der Daten.";

    }

}
async function loadExistingData(){

    const firstName =
        document.getElementById("firstName").value.trim();

    const lastName =
        document.getElementById("lastName").value.trim();

    if(!firstName || !lastName){
        return;
    }

    const response =
        await fetch(SCRIPT_URL);

    const data =
        await response.json();

    const personEntries =
        data.filter(
            entry =>
            entry.firstName === firstName &&
            entry.lastName === lastName
        );

    if(personEntries.length === 0){
        return;
    }

    personEntries.forEach(entry => {

        const shift =
            shifts.find(
                s => s.label === entry.shift
            );

        if(!shift){
            return;
        }

        const radio =
            document.querySelector(
                `input[name="${shift.id}"][value="${entry.status}"]`
            );

        if(radio){
            radio.checked = true;
        }

    });

    alert(
        "Vorhandener Eintrag gefunden und geladen."
    );

}
function showAdminLogin(){

    document
      .getElementById("adminLogin")
      .style.display="block";

}
function loginAdmin(){

    const password =
      document
      .getElementById("adminPassword")
      .value;

    if(password !== "BB26"){

        alert("Falsches Passwort");
        return;

    }

    document
      .getElementById("adminPanel")
      .style.display="block";

    createWeekendButtons();

}
function downloadCSV(content,fileName){

    const blob =
      new Blob(
        [content],
        {
          type:"text/csv;charset=utf-8;"
        }
      );

    const link =
      document.createElement("a");

    link.href =
      URL.createObjectURL(blob);

    link.download =
      fileName;

    link.click();

}
function createWeekendButtons(){

    const container =
      document.getElementById(
        "weekendExports"
      );

    container.innerHTML="";

    shifts.forEach(shift=>{

        const btn =
          document.createElement("button");

        btn.innerText =
          "📥 " + shift.label;

        btn.style.marginBottom =
          "5px";

        btn.onclick =
          () => exportWeekend(
              shift.label
            );

        container.appendChild(btn);

        container.appendChild(
          document.createElement("br")
        );

    });

}
async function exportWeekend(shiftName){

    const response =
      await fetch(SCRIPT_URL);

    const data =
      await response.json();

    const filtered =
      data.filter(
        d =>
          d.shift === shiftName
      );

    let csv =
      "Vorname;Nachname;Status\n";

    filtered.forEach(row=>{

        csv +=
          `${row.firstName};${row.lastName};${row.status}\n`;

    });

    downloadCSV(
      csv,
      shiftName.replaceAll(" ","_") +
      ".csv"
    );

}

createShifts();

document
  .getElementById("shiftContainer")
  .style.display = "none";
  
  document
    .getElementById("saveContainer")
    .style.display = "none";

loadOverview();
loadParticipantList();

document
  .getElementById("firstName")
  .addEventListener("blur", loadExistingData);

document
  .getElementById("lastName")
  .addEventListener("blur", loadExistingData);

</script>


</body>
</html>
